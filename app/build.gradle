plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kemo.calc'
    compileSdk 34

    defaultConfig {
        applicationId "com.kemo.calc"
        minSdk 28          // Android 9+
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // signed with the debug key so the APK installs directly (replace for Play Store)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    androidResources {
        noCompress 'wav'
    }
}

dependencies {
    // intentionally empty: pure Android framework => tiny & fast APK
}
