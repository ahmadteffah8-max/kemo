name: Build KEMO APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release + debug APK
        run: gradle --no-daemon assembleRelease assembleDebug

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/kemo.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/kemo-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kemo-apk
          path: dist/*.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: KEMO APK (latest)
          body: "Direct download: kemo.apk — install on Android 9+."
          files: |
            dist/kemo.apk
            dist/kemo-debug.apk
